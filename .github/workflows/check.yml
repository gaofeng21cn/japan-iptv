name: Validate curated playlist
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify generated playlist and negative playback cases
        run: |
          python3 scripts/maintain.py build --verify
          python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Audit enabled baselines
        run: python3 scripts/maintain.py audit
      - name: Install media probe
        if: github.event_name == 'workflow_dispatch'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: GitHub-hosted stream check
        if: github.event_name == 'workflow_dispatch'
        run: python3 scripts/maintain.py check --site github
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'workflow_dispatch'
        with:
          name: github-stream-health
          path: |
            reports/health.json
            reports/baseline-audit.json
          if-no-files-found: ignore
